apiVersion: apps/v1
kind: Deployment
metadata:
  name: repairshop-backend-deployment
  namespace: microservice
  labels:
    app: repairshop-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: repairshop-backend
  template:
    metadata:
      labels:
        app: repairshop-backend
    spec:
      containers:
      - name: repairshop-backend-container
        image: phanhuukhoinguyen1205/repairshop-backend:3.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: repairshop-config
        - secretRef:
            name: repairshop-secret
        env:
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:MaxRAMPercentage=70"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        startupProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 10
          failureThreshold: 18      
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 6
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: repairshop-frontend-deployment
  namespace: microservice
  labels:
    app: repairshop-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: repairshop-frontend
  template:
    metadata:
      labels:
        app: repairshop-frontend
    spec:
      containers:
      - name: repairshop-frontend-container
        image: phanhuukhoinguyen1205/repairshop-frontend:3.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
        readinessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6

apiVersion: v1
kind: Service
metadata:
  name: repairshop-backend-svc
  namespace: microservice
spec:
  type: NodePort
  selector:
    app: repairshop-backend
  ports:
    - name: http
      port: 8080          # cổng của Service trong cluster
      targetPort: 8080    # cổng container backend (SERVER_PORT)
      nodePort: 30071     # cổng truy cập từ ngoài: http://<IP-node>:30070
---
apiVersion: v1
kind: Service
metadata:
  name: repairshop-frontend-svc
  namespace: microservice
spec:
  type: NodePort
  selector:
    app: repairshop-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000    # container frontend lắng nghe cổng 3000
      nodePort: 30073     # truy cập: http://<IP-node>:30073
      appProtocol: http

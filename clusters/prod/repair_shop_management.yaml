# clusters/dev/repairshop.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-repairshop
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/PhanHuuKhoiNguyen/gitops-repo
    targetRevision: main
    path: apps/repair_shop_management/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: microservice
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
